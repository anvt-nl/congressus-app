<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mijn token</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="bg-slate-50 min-h-screen pb-20">
    <div class="max-w-3xl mx-auto px-4 py-10">
      <header class="mb-8 flex items-center gap-4">
        <a
          href="index.html"
          class="p-2 bg-white rounded-lg border shadow-sm hover:bg-slate-50 transition"
        >
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-3xl font-black text-slate-900 tracking-tight">
            Mijn token
          </h1>
          <p class="text-slate-500">
            Bekijk hier het lokaal opgeslagen toegangstoken.
          </p>
        </div>
      </header>

      <div class="bg-white rounded-xl border shadow-sm p-6">
        <div id="tokenState" class="text-sm text-slate-500 mb-4">
          Token laden...
        </div>

        <div class="mb-4">
          <label
            for="tokenValue"
            class="block text-sm font-medium text-slate-700 mb-2"
          >
            Token
          </label>
          <textarea
            id="tokenValue"
            rows="4"
            readonly
            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm font-mono text-slate-700"
            placeholder="Geen token gevonden"
          ></textarea>
        </div>

        <p id="tokenExpiresAt" class="text-sm text-slate-500 mb-6"></p>

        <div class="flex gap-3">
          <button
            id="removeTokenBtn"
            class="flex items-center gap-2 bg-red-600 text-white px-4 py-2 rounded-lg shadow-sm hover:bg-red-700 transition"
          >
            <i data-lucide="trash-2" class="w-4 h-4"></i> Verwijder token
          </button>
        </div>

        <p id="tokenMessage" class="mt-4 text-sm"></p>
      </div>
    </div>

    <script src="vendor/lucide.min.js"></script>
    <script src="token.js"></script>
  </body>
</html>
