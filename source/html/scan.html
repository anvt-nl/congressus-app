<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANVT QR Code Scanner</title>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="max-w-2xl mx-auto px-4 py-10">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-yellow-400 rounded-full mb-4 shadow-lg">
          <i data-lucide="qr-code" class="w-10 h-10 text-white"></i>
        </div>
        <h1 class="text-3xl font-black text-slate-900 mb-2">ANVT QR Code Scanner</h1>
        <p class="text-slate-600">Scan QR codes met je camera</p>
        <div class="mt-4 flex justify-center">
          <button
            id="closestEventBtn"
            class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg shadow hover:bg-blue-700 transition font-medium"
          >
            <i data-lucide="calendar-range" class="w-5 h-5"></i>
            Ga naar dichtstbijzijnde evenement
          </button>
        </div>
      </div>

      <!-- Scanner Container -->
      <div class="bg-white rounded-2xl shadow-xl overflow-hidden mb-6">
        <!-- Scanner Area (Hidden Initially) -->
        <div id="scannerContainer" class="hidden">
          <div id="reader" class="bg-black"></div>
        </div>

        <!-- Scan Button (Shown Initially) -->
        <div id="scanButtonContainer" class="p-8 text-center">
          <button
            id="startScanBtn"
            class="inline-flex items-center gap-3 bg-gradient-to-r from-yellow-400 to-yellow-500 text-white px-8 py-4 rounded-xl shadow-lg hover:shadow-xl hover:from-yellow-500 hover:to-yellow-600 transition-all duration-300 transform hover:scale-105 font-semibold text-lg"
          >
            <i data-lucide="scan" class="w-6 h-6"></i>
            Start Scannen
          </button>
          <p class="text-slate-500 text-sm mt-4">
            Klik om je camera te activeren
          </p>
        </div>

        <!-- Stop Button (Hidden Initially) -->
        <div
          id="stopButtonContainer"
          class="hidden p-4 bg-slate-100 border-t border-slate-200"
        >
          <button
            id="stopScanBtn"
            class="w-full flex items-center justify-center gap-2 bg-red-500 text-white px-4 py-3 rounded-lg shadow hover:bg-red-600 transition font-medium"
          >
            <i data-lucide="x-circle" class="w-5 h-5"></i>
            Stop Scannen
          </button>
        </div>
      </div>

      <!-- Loading Section -->
      <div id="loadingContainer" class="hidden bg-white rounded-2xl shadow-xl p-8 mb-6 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 mb-4 animate-spin">
          <i data-lucide="loader-2" class="w-10 h-10 text-blue-600"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900 mb-2">Ticket wordt gecontroleerd...</h2>
        <p class="text-slate-600">Een moment geduld aub. Dit kan enkele seconden duren als we de lijst moeten bijwerken.</p>
      </div>

      <!-- Results Section -->
      <div id="resultsContainer" class="hidden">
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
          <div class="flex items-start gap-3 mb-4">
            <div
              class="flex-shrink-0 w-10 h-10 bg-green-100 rounded-full flex items-center justify-center"
            >
              <i data-lucide="check-circle" class="w-6 h-6 text-green-600"></i>
            </div>
            <div class="flex-1">
              <h2 class="text-xl font-bold text-slate-900 mb-1">
                Scan gelukt!
              </h2>
              <p class="text-slate-600 text-sm">Hier is wat we hebben gevonden:</p>
            </div>
          </div>

          <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
            <div class="flex items-start gap-2 mb-2">
              <i
                data-lucide="file-text"
                class="w-4 h-4 text-slate-500 mt-1 flex-shrink-0"
              ></i>
              <div class="flex-1 min-w-0">
                <p class="text-xs text-slate-500 font-medium mb-1">
                  Gescande gegevens:
                </p>
                <p
                  id="scanResult"
                  class="text-slate-900 font-mono text-sm break-all"
                ></p>
              </div>
            </div>
          </div>

          <div class="flex gap-3 mt-4">
            <button
              id="scanAgainBtn"
              class="flex-1 flex items-center justify-center gap-2 bg-blue-600 text-white px-4 py-3 rounded-lg shadow hover:bg-blue-700 transition font-medium"
            >
              <i data-lucide="rotate-cw" class="w-5 h-5"></i>
              Scan Opnieuw
            </button>
            <button
              id="copyBtn"
              class="flex items-center justify-center gap-2 bg-slate-200 text-slate-700 px-4 py-3 rounded-lg shadow hover:bg-slate-300 transition font-medium"
            >
              <i data-lucide="copy" class="w-5 h-5"></i>
              Kopiëren
            </button>
          </div>
        </div>
      </div>

      <!-- Error Section -->
      <div
        id="errorContainer"
        class="hidden bg-red-50 border border-red-200 rounded-xl p-4 mb-6"
      >
        <div class="flex items-start gap-3">
          <i
            data-lucide="alert-circle"
            class="w-5 h-5 text-red-600 mt-0.5 flex-shrink-0"
          ></i>
          <div class="flex-1">
            <p class="text-red-900 font-semibold mb-1">Fout</p>
            <p id="errorMessage" class="text-red-700 text-sm"></p>
          </div>
        </div>
      </div>
    </div>

    <script src="vendor/lucide.min.js"></script>
    <script src="vendor/html5-qrcode.min.js"></script>
    <script src="events_cache.js"></script>
    <script src="scan.js"></script>
  </body>
</html>
