<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | ANVT Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-slate-50 min-h-screen pb-20">
    <div class="max-w-3xl mx-auto px-4 py-10">
      <header class="mb-10">
        <div class="flex items-center gap-4 mb-4">
          <a
            href="index.html"
            class="p-2 bg-white rounded-lg border shadow-sm hover:bg-slate-50 transition"
          >
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </a>
          <h1 class="text-3xl font-black text-slate-900 tracking-tight">
            Database Beheer
          </h1>
        </div>
        <p class="text-slate-500 italic">
          Beheer hier de lokale cache database van het ANVT Dashboard.
        </p>
      </header>

      <div
        class="bg-amber-50 border border-amber-200 p-4 rounded-xl mb-8 flex gap-3"
      >
        <i
          data-lucide="alert-triangle"
          class="text-amber-600 w-6 h-6 shrink-0"
        ></i>
        <p class="text-sm text-amber-800">
          <strong>Let op:</strong> Het leegmaken van tabellen verwijdert alle
          gecachte gegevens. De gegevens worden opnieuw opgehaald van de
          Congressus API zodra ze weer nodig zijn.
        </p>
      </div>

      <div id="tableList" class="grid gap-4">
        <!-- Tables will be loaded here -->
      </div>
    </div>

    <script src="admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
      });
    </script>
  </body>
</html>
