<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Participations Overview</title>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="bg-slate-50 min-h-screen pb-20">
    <div class="max-w-4xl mx-auto px-4 py-10">
      <!-- Navigation links -->
      <div class="mb-4 flex flex-col gap-2 sm:flex-row sm:gap-4">
        <button
          id="backToEventsBtn"
          class="text-left text-blue-600 underline sm:text-center"
        >
          &larr; Terug naar evenementen
        </button>
        <button
          id="toggleApprovedBtn"
          class="text-left text-blue-600 underline sm:text-center"
        >
          Toon alles
        </button>
      </div>

      <!-- Event title and date -->
      <div class="mb-4">
        <h1 id="eventHeading" class="text-2xl font-black text-slate-900">
          Participations Overview
        </h1>
        <div id="eventDate" class="text-slate-500 text-base font-normal"></div>
        <div
          id="eventNavigation"
          class="mt-2 flex items-center justify-between gap-4 text-sm"
        ></div>
      </div>

      <!-- Controls row: checkboxes left, buttons right -->
      <div
        class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
      >
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-2 text-sm">
            <input
              type="checkbox"
              id="hidePresentSwitch"
              class="accent-blue-600"
            />
            Verberg aanwezigen
          </label>
        </div>
        <div
          class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:justify-end"
        >
          <a
            href="scan.html"
            class="flex w-full items-center justify-center gap-2 rounded-lg bg-yellow-400 px-4 py-2 text-white shadow-sm transition hover:bg-yellow-500 sm:w-auto"
          >
            <i data-lucide="scan" class="w-4 h-4"></i> Scan Tickets
          </a>
          <button
            id="syncBtn"
            class="flex w-full items-center justify-center gap-2 rounded-lg border bg-white px-4 py-2 shadow-sm transition hover:bg-slate-50 sm:w-auto"
          >
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sync Data
          </button>
          <button
            id="collectTicketsBtn"
            class="flex w-full items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-white shadow-sm transition hover:bg-blue-700 sm:w-auto"
          >
            <i data-lucide="ticket" class="w-4 h-4"></i> Collect Tickets
          </button>
        </div>
      </div>

      <div
        id="forceSyncMsg"
        class="hidden text-green-600 text-xs font-semibold mb-4"
      >
        Force sync voltooid!
      </div>
      <div id="loading" class="text-slate-500 mb-4">Deelnemers laden...</div>
      <div id="participationsTable"></div>
    </div>

    <script src="vendor/lucide.min.js"></script>
    <script src="events_cache.js"></script>
    <script src="event_heading.js"></script>
    <script src="participations_overview.js"></script>
  </body>
</html>
